<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Temple Dash</title>
<link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Rubik:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#f3ead2;--gold:#f2b632;--ember:#c8452c;--moss:#2f4a2b;--night:#0c1710;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);overflow:hidden;font-family:Rubik,system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%}
#hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:18px;right:18px;display:flex;justify-content:space-between;font-size:22px;font-weight:600;pointer-events:none;text-shadow:0 2px 8px #000c}
#co{color:var(--gold)}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#0c1710aa,#0c1710ee);padding:20px;text-align:center}
#ov.off{display:none}
.panel{max-width:420px}
h1{font-family:"Uncial Antiqua",Georgia,serif;font-weight:400;font-size:clamp(40px,10vw,68px);margin:0 0 6px;color:var(--gold);letter-spacing:.02em;text-shadow:0 3px 0 #5a3a0a}
p{margin:6px 0;line-height:1.5;font-size:17px}
.keys{opacity:.8;font-size:15px;margin-top:14px}
button{margin-top:22px;font:600 20px Rubik,system-ui,sans-serif;color:#2a1604;background:var(--gold);border:0;border-radius:6px;padding:14px 38px;cursor:pointer;box-shadow:0 5px 0 #8a5a0c}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #8a5a0c}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<div id="hud"><span id="sc">0 m</span><span id="co">0 coins</span></div>
<div id="ov"><div class="panel">
<h1 id="ti">Temple Dash</h1>
<p id="tx">You took the idol. Now run.</p>
<p class="keys" id="ks">Arrow keys or A/D change lane, up or W jumps, down or S slides. On a phone, swipe left, right, up or down.</p>
<button id="go">Run</button>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x16301f);
scene.fog=new THREE.Fog(0x16301f,25,105);
const cam=new THREE.PerspectiveCamera(65,1,.1,200);
function rs(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
scene.add(new THREE.HemisphereLight(0xcfe8c0,0x2a2a1a,.95));
const sun=new THREE.DirectionalLight(0xffd9a0,.8);sun.position.set(-5,12,6);scene.add(sun);
const torch=new THREE.PointLight(0xffa850,1.1,16);scene.add(torch);

const mat=(c,o={})=>new THREE.MeshLambertMaterial(Object.assign({color:c,flatShading:true},o));
const stone=mat(0xb9a77c),stone2=mat(0xa8956a),rock=mat(0x6e6a5a),wood=mat(0x6b4423),pit=mat(0x050805),leaf=mat(0x2f6b34),leaf2=mat(0x3d8240),gold=mat(0xf2b632,{emissive:0x6a4a00});
const G={};
function box(w,h,d,m,x,y,z,p){const k=w+','+h+','+d;const o=new THREE.Mesh(G[k]||(G[k]=new THREE.BoxGeometry(w,h,d)),m);o.position.set(x,y,z);p.add(o);return o}
const trunkG=new THREE.CylinderGeometry(.35,.5,5,6),leafG=new THREE.IcosahedronGeometry(2.3,0);
const coinG=new THREE.CylinderGeometry(.4,.4,.12,12).rotateX(Math.PI/2);

// player
const pl=new THREE.Group();scene.add(pl);
const body=box(.9,1.0,.6,mat(0xc8452c),0,1.1,0,pl);
box(.8,.7,.3,mat(0x8a5a2a),0,1.15,.4,pl);
const head=new THREE.Mesh(new THREE.SphereGeometry(.34,10,8),mat(0xe0b080));head.position.y=1.9;pl.add(head);
box(.95,.1,.95,mat(0x7a4f22),0,2.12,0,pl);box(.55,.25,.55,mat(0x7a4f22),0,2.25,0,pl);
const legL=box(.3,.7,.3,mat(0x3a2f22),-.22,.35,0,pl),legR=box(.3,.7,.3,mat(0x3a2f22),.22,.35,0,pl);
legL.geometry=legR.geometry=new THREE.BoxGeometry(.3,.7,.3).translate(0,-.35,0);
legL.position.y=legR.position.y=.7;

const LANES=[-2.2,0,2.2],RL=8;
let rows=[],rowN=0;
function spawnRow(z,safe){
  const g=new THREE.Group();g.position.z=z;scene.add(g);
  const r={g,z,h:[],c:[],gap:false};rowN++;
  if(!safe&&Math.random()<.14){
    r.gap=true;
    box(7.6,.6,1.4,stone,0,-.3,-3.3,g);box(7.6,.6,1.4,stone,0,-.3,3.3,g);box(7.6,.2,5.2,pit,0,-3,0,g);
    for(let i=-2;i<=2;i++){const c=new THREE.Mesh(coinG,gold);c.position.set(0,2.2-Math.abs(i)*.18,i*1.1);g.add(c);r.c.push({m:c,l:1,lz:i*1.1})}
  }else{
    box(7.6,.6,RL,rowN%2?stone:stone2,0,-.3,0,g);
    let used=[];
    if(!safe){
      const t=Math.random();
      if(t<.28){box(7.2,.9,.8,rock,0,.45,0,g);r.h.push({t:'low',l:-1})}
      else if(t<.52){box(.5,2.6,.5,wood,-3.5,1.3,0,g);box(.5,2.6,.5,wood,3.5,1.3,0,g);box(7.5,.7,.6,wood,0,2.0,0,g);r.h.push({t:'beam',l:-1})}
      else{
        const free=Math.floor(Math.random()*3),n=Math.random()<.4?2:1;
        const others=[0,1,2].filter(i=>i!==free).sort(()=>Math.random()-.5).slice(0,n);
        others.forEach(i=>{box(1.9,2.2,1.2,rock,LANES[i],1.1,0,g);r.h.push({t:'block',l:i});used.push(i)});
      }
    }
    if(Math.random()<.55){
      const opts=[0,1,2].filter(i=>!used.includes(i)),l=opts[Math.floor(Math.random()*opts.length)];
      for(let i=-2;i<=2;i++){const c=new THREE.Mesh(coinG,gold);c.position.set(LANES[l],1,i*1.3);g.add(c);r.c.push({m:c,l,lz:i*1.3})}
    }
  }
  box(.4,.9,RL,rock,-3.95,.45,0,g);box(.4,.9,RL,rock,3.95,.45,0,g);
  for(let i=0;i<3;i++){
    const s=Math.random()<.5?-1:1,x=s*(6+Math.random()*9),zz=(Math.random()-.5)*RL;
    const tr=new THREE.Mesh(trunkG,wood);tr.position.set(x,2.5,zz);g.add(tr);
    const lf=new THREE.Mesh(leafG,Math.random()<.5?leaf:leaf2);lf.position.set(x,5.8,zz);lf.scale.y=1.3;g.add(lf);
  }
  if(Math.random()<.25){const s=Math.random()<.5?-1:1;box(1.2,7,1.2,stone,s*5.2,3.5,0,g);box(1.8,.5,1.8,stone,s*5.2,7,0,g)}
  rows.push(r);
}

let st='menu',speed=0,dist=0,coins=0,lane=1,px=0,y=0,vy=0,slide=0,shake=0,t=0,best=0,why='';
try{best=+localStorage.getItem('td_best')||0}catch(e){}
function reset(){
  rows.forEach(r=>scene.remove(r.g));rows=[];rowN=0;
  lane=1;px=0;y=0;vy=0;slide=0;speed=13;dist=0;coins=0;shake=0;
  for(let i=0;i<18;i++)spawnRow(8-i*RL,i<4);
}
function start(){reset();st='play';$('ov').classList.add('off')}
function die(m){
  if(st!=='play')return;st='over';why=m;shake=.5;
  const s=Math.floor(dist)+coins*10;
  const isBest=s>best;if(isBest){best=s;try{localStorage.setItem('td_best',s)}catch(e){}}
  $('ti').textContent='Run over';
  $('tx').innerHTML=m+'<br>Score '+s+' ('+Math.floor(dist)+' m and '+coins+' coins)<br>'+(isBest?'New best score!':'Best score '+best);
  $('ks').style.display='none';$('go').textContent='Run again';
  setTimeout(()=>$('ov').classList.remove('off'),700);
}
$('go').onclick=start;

function left(){if(st==='play')lane=Math.max(0,lane-1)}
function right(){if(st==='play')lane=Math.min(2,lane+1)}
function jump(){if(st==='play'&&y<=.01&&vy===0){vy=13;slide=0}}
function down(){if(st!=='play')return;slide=.7;if(y>.01)vy=-22}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowleft','a'].includes(k))left();else if(['arrowright','d'].includes(k))right();
  else if(['arrowup','w',' '].includes(k)){jump();e.preventDefault()}else if(['arrowdown','s'].includes(k)){down();e.preventDefault()}
});
let p0=null;
renderer.domElement.addEventListener('pointerdown',e=>{p0=[e.clientX,e.clientY]});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!p0)return;const dx=e.clientX-p0[0],dy=e.clientY-p0[1];p0=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24){jump();return}
  if(Math.abs(dx)>Math.abs(dy))dx<0?left():right();else dy<0?jump():down();
});

function update(dt){
  speed=Math.min(13+dist/150,30);
  const d=speed*dt;dist+=d;
  for(const r of rows){r.z+=d;r.g.position.z=r.z}
  while(rows[0]&&rows[0].z>14){scene.remove(rows[0].g);rows.shift()}
  while(rows[rows.length-1].z>-124)spawnRow(rows[rows.length-1].z-RL,false);
  px+=(LANES[lane]-px)*Math.min(1,dt*14);
  let gapUnder=false;
  for(const r of rows)if(r.gap&&Math.abs(r.z)<2.4)gapUnder=true;
  if(y<=0&&!gapUnder&&vy<=0){y=0;vy=0}else{vy-=32*dt;y+=vy*dt}
  if(y<-5)return die('You fell into the pit.');
  if(slide>0)slide-=dt;
  for(const r of rows){
    if(Math.abs(r.z)>5)continue;
    for(const h of r.h){
      if(Math.abs(r.z)<.7&&(h.l<0||h.l===lane)){
        if(h.t==='low'&&y<.75)return die('You tripped on a stone wall.');
        if(h.t==='beam'&&slide<=0)return die('You hit a low beam.');
        if(h.t==='block'&&y<2.2)return die('You ran into a stone block.');
      }
    }
    for(const c of r.c)if(c.m.visible&&c.l===lane&&Math.abs(r.z+c.lz)<.9&&y<2.4){c.m.visible=false;coins++}
  }
  $('sc').textContent=Math.floor(dist)+' m';$('co').textContent=coins+' coins';
}

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
  if(st==='play')update(dt);
  pl.position.set(px,y,0);
  const sl=slide>0&&y<=.01;
  pl.scale.y=sl?.55:1;pl.rotation.x=sl?-.5:0;
  const run=st==='play'?t*(10+speed*.3):t*3;
  legL.rotation.x=Math.sin(run)*.9;legR.rotation.x=-Math.sin(run)*.9;
  body.position.y=1.1+(st==='play'?Math.abs(Math.sin(run))*.06:0);
  for(const r of rows)for(const c of r.c)c.m.rotation.y=t*3;
  shake=Math.max(0,shake-dt);
  const sh=shake*(Math.random()-.5)*.6;
  cam.position.set(px*.6+sh,4.6+y*.3,7.6);
  cam.lookAt(px*.5,1.6,-8);
  torch.position.set(px,3.5,3);
  renderer.render(scene,cam);
  requestAnimationFrame(frame);
}
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
